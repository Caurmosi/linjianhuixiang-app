# 《林间回响》后端 Docker 镜像自动构建（推送到 GitHub Container Registry）
# 触发：push 到 main 时，若 backend/ 有改动
# 产物：ghcr.io/<你的GitHub用户名>/linjianhuixiang-backend:latest
# 免费：GitHub Actions 构建免费，ghcr.io 镜像存储免费
name: Build Backend Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch: # 允许手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/linjianhuixiang-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送 ghcr.io 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建时下载真实 BirdNET 模型（约 170MB，Zenodo 官方源）
          build-args: |
            DOWNLOAD_MODEL=true

      # 关键：ghcr 镜像默认私有，且可能不自动显示在仓库 Packages 页签。
      # 用 API 把包设为 public（免费托管平台才能匿名拉取），并删除 private 包（避免占私有额度）。
      - name: Make package public
        shell: bash
        run: |
          # 包名 = IMAGE_NAME 去掉 owner 前缀（ghcr 剥离用户名）→ linjianhuixiang-app/linjianhuixiang-backend
          # 注意1：GitHub API 的 package_name 必须 URL 编码（斜杠 → %2F），否则 PATCH 404、镜像保持 private
          # 注意2：PATCH /user/packages 是"当前认证用户"（github-actions bot）的包，而包实际归属 github.actor 用户
          #        → 必须用 /users/{owner}/packages 端点，否则 bot 名下查无此包、PATCH 404、镜像保持 private
          PKG="linjianhuixiang-app%2Flinjianhuixiang-backend"
          echo "Setting $PKG visibility to public (owner: ${{ github.repository_owner }})..."
          HTTP_CODE=$(curl -s -o /tmp/pkg_public_resp.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/$PKG" \
            -d '{"visibility":"public"}')
          echo "HTTP $HTTP_CODE"
          cat /tmp/pkg_public_resp.json | head -c 300
          echo ""
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "::warning::设 public 失败——Sealos/Zeabur 匿名拉取会失败，请到仓库 Packages 页签手动设为 Public"
          fi
          echo "Done."
